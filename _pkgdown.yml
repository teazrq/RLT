# pkgdown site configuration for https://teazrq.github.io/RLT/

url: https://teazrq.github.io/RLT

template:
  bootstrap: 5
  bslib:
    preset: cosmo
    primary: "#1967b5"

figures:
  out.extra: 'loading="lazy"'

footer:
  structure:
    left: [developed_by, source]
    right: built_with
  components:
    source: "[Source code](https://github.com/teazrq/RLT)"

navbar:
  type: dark
  bg: primary
  structure:
    right: [search, github]
  left:
    - text: "Get Started"
      href: articles/get-started.html
    - text: "Tutorials"
      menu:
        - text: "Regression"
          href: articles/regression-tutorial.html
        - text: "Classification"
          href: articles/classification-tutorial.html
        - text: "Survival"
          href: articles/survival-tutorial.html
        - text: "RLT with Linear Combinations"
          href: articles/linear-combinations.html
        - text: "Random Seed and Reproducibility"
          href: articles/feature-seed.html
        - text: "Variable Importance (Permutation and Distributed)"
          href: articles/variable-importance.html
        - text: "Random Forest Kernel"
          href: articles/feature-kernel.html
        - text: "Single Tree"
          href: articles/feature-single-tree.html
        - text: "Survival Confidence Band"
          href: articles/confidence-interval.html
    - text: "Reference"
      href: reference/index.html
    - text: "Changelog"
      href: news/index.html
articles:
  - title: "Start Here"
    contents:
      - articles/get-started
  - title: "Tutorials"
    contents:
      - regression-tutorial
      - classification-tutorial
      - survival-tutorial
      - articles/linear-combinations
      - articles/feature-seed
      - articles/variable-importance
      - articles/feature-kernel
      - articles/feature-single-tree
      - articles/confidence-interval

reference:
  - title: "Core Modeling Functions"
    desc: "Fit, predict, and print RLT models."
    contents:
      - RLT
      - predict.RLT
      - print.RLT

  - title: "Model Analysis and Utilities"
    desc: "Inspect fitted models, variable importance, kernels, and survival bands."
    contents:
      - importance
      - print.importance.RLT
      - forest.kernel
      - get.one.tree
      - get.surv.band
      - cindex
